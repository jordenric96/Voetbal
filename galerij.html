<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galerij</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <header>
        <h1>Galerij</h1>
        <nav>
            <a href="index.html">Overzicht</a>
            <a href="stats.html">Stats</a>
            <a href="ploegen.html">Ploegen</a>
            <a href="galerij.html" class="active">Galerij</a>
            <a href="medisch.html">Medisch</a>
        </nav>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="wisselSpeler(event, 'Lou')">Lou</button>
        <button class="tab-btn" onclick="wisselSpeler(event, 'Noé')">Noé</button>
    </div>

    <main id="photo-album-container" style="padding: 0 20px 100px 20px;">
        <p class="empty-state">Media inladen... ⏳</p>
    </main>

    <button onclick="openUploadModal()" class="fab-btn">📷/🎥 Media</button>

    <!-- UPLOAD MODAL -->
    <div id="upload-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17,24,39,0.5); backdrop-filter: blur(5px); z-index: 9000; align-items: flex-end; justify-content: center;">
        <div style="background: #fff; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 30px 20px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s ease;" id="upload-modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 20px; font-weight: 800;">Media Toevoegen</h2>
                <button onclick="closeUploadModal()" style="background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; color: #64748b; cursor: pointer;">✕</button>
            </div>
            
            <div class="form-group">
                <label>Kies Datum</label>
                <input type="date" id="extra-datum" required>
            </div>
            
            <div class="form-group">
                <label>Opmerking / Beschrijving (Optioneel)</label>
                <textarea id="extra-opmerking" rows="2" placeholder="Bijv. Eerste doelpunt..."></textarea>
            </div>

            <div class="form-group">
                <label>Selecteer Foto's en/of Video's</label>
                <input type="file" id="extra-fotos" accept="image/*, video/*" multiple required>
                <span style="font-size: 10px; color: #94a3b8; display: block; margin-top: 6px;">Hogere kwaliteit is actief (tot 2MB / 2560px per foto). Video's worden ongewijzigd geüpload.</span>
            </div>
            
            <button id="upload-btn" onclick="saveExtraFotos()" class="submit-btn">Uploaden</button>
        </div>
    </div>

    <!-- LIGHTBOX -->
    <div id="lightbox" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s ease;">
        
        <div style="position: absolute; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px; padding-top: max(20px, env(safe-area-inset-top)); box-sizing: border-box; z-index: 10000; background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);">
            <span id="lb-counter" style="color: #fff; font-size: 15px; font-weight: 800; letter-spacing: 0.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.8);"></span>
            
            <div style="display: flex; gap: 10px;">
                <button id="lb-edit-btn" onclick="bewerkHuidigeFoto()" style="background: rgba(255,255,255,0.2); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">✏️</button>
                <button onclick="verwijderHuidigeFoto()" style="background: rgba(220, 38, 38, 0.8); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">🗑️</button>
                <button onclick="closeLightbox()" style="background: rgba(255,255,255,0.2); color: #fff; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">✕</button>
            </div>
        </div>

        <button id="lb-prev" onclick="prevImage(event)" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; z-index: 10000; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">&#10094;</button>
        <button id="lb-next" onclick="nextImage(event)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; z-index: 10000; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px);">&#10095;</button>

        <img id="lb-img" src="" style="width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s ease; display: none;">
        <video id="lb-video" src="" controls playsinline style="width: 100%; height: 100%; object-fit: contain; transition: opacity 0.2s ease; display: none;"></video>
        
        <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 40px 20px 20px 20px; padding-bottom: max(20px, env(safe-area-inset-bottom)); box-sizing: border-box; background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 60%, transparent 100%); display: flex; flex-direction: column; align-items: flex-start; z-index: 10000;">
            <div id="lb-tags" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;"></div>
            <p id="lb-title" style="color: #fff; font-weight: 800; font-size: 18px; margin: 0 0 6px 0; text-shadow: 0 1px 4px rgba(0,0,0,0.8); text-align: left;"></p>
            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                <p id="lb-date" style="color: #cbd5e1; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; margin: 0;"></p>
                <a id="lb-link" href="#" style="background: rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 800; text-decoration: none; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);">Match Details &rarr;</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <script src="js/database.js"></script>

    <script>
        let huidigeSpeler = 'Lou';
        let alleFotosGlobal = []; 
        let groepenGlobal = []; // Om groepen in bulk te kunnen wissen
        let currentLbIndex = 0;   

        const badgeColors = {
            'U6': { bg: '#fef08a', text: '#713f12' }, 
            'U7': { bg: '#fed7aa', text: '#7c2d12' }, 
            'U8': { bg: '#fecaca', text: '#7f1d1d' }, 
            'U9': { bg: '#fbcfe8', text: '#831843' }, 
            'U10': { bg: '#e9d5ff', text: '#581c87' }, 
            'U11': { bg: '#c7d2fe', text: '#312e81' }, 
            'U12': { bg: '#bae6fd', text: '#0c4a6e' }, 
            'U13': { bg: '#99f6e4', text: '#0f766e' }, 
            'U14': { bg: '#bbf7d0', text: '#14532d' }, 
            'U15': { bg: '#d9f99d', text: '#3f6212' }, 
            'U16': { bg: '#fde68a', text: '#92400e' }, 
            'U17': { bg: '#fcd34d', text: '#92400e' }, 
            'Beloften': { bg: '#e2e8f0', text: '#1e293b' },
            'Eerste Ploeg': { bg: '#1e293b', text: '#f9fafb' },
            'Veteranen': { bg: '#9ca3af', text: '#1e293b' },
            'Competitie': { bg: '#e0f2fe', text: '#0369a1' }, 
            'Toernooi': { bg: '#f3e8ff', text: '#7e22ce' }, 
            'Vriendschappelijk': { bg: '#dcfce7', text: '#15803d' }, 
            'Thuis': { bg: '#e0e7ff', text: '#3730a3' }, 
            'Uit': { bg: '#ffedd5', text: '#9a3412' }, 
            'Extra': { bg: '#334155', text: '#f8fafc' }, 
            'Standaard': { bg: '#f3f4f6', text: '#4b5563' }
        };

        function getBadgeHtml(waarde) {
            if (!waarde) return '';
            const style = badgeColors[waarde] || badgeColors['Standaard'];
            return `<span style="display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px; background-color: ${style.bg}; color: ${style.text}; border: 1px solid ${style.bg};">${waarde}</span>`;
        }

        async function laadFotos(speler) {
            huidigeSpeler = speler;
            const container = document.getElementById('photo-album-container');
            container.innerHTML = '<p class="empty-state">Media laden... ⏳</p>';
            groepenGlobal = [];

            try {
                const [matchRes, extraRes, videoRes] = await Promise.all([
                    supabaseClient.from('wedstrijden').select('*').eq('speler', speler),
                    supabaseClient.from('extra_fotos').select('*').eq('speler', speler),
                    supabaseClient.from('extra_videos').select('*').eq('speler', speler)
                ]);

                if (matchRes.error) throw matchRes.error;
                if (extraRes.error) throw extraRes.error;

                let alleMedia = [];

                matchRes.data.forEach(match => {
                    if (match.fotos && match.fotos.length > 0) {
                        const isToernooi = match.type_wedstrijd === 'Toernooi';
                        const subtitel = isToernooi ? `🏆 ${match.tegenstander}` : `⚽ vs ${match.tegenstander}`;
                        
                        let tagsHtml = getBadgeHtml(match.categorie) + getBadgeHtml(match.type_wedstrijd);
                        if (!isToernooi && match.locatie) tagsHtml += getBadgeHtml(match.locatie);

                        match.fotos.forEach(url => {
                            const isVid = url.toLowerCase().match(/\.(mp4|mov|mkv|webm)$/) != null;
                            alleMedia.push({ 
                                url: url, datumRuw: new Date(match.datum), titel: subtitel, matchId: match.id, 
                                type: 'match', isVideo: isVid, tags: tagsHtml 
                            });
                        });
                    }
                });

                extraRes.data.forEach(foto => {
                    const subtitel = foto.opmerking ? `📷 ${foto.opmerking}` : `📷 Training / Extra`;
                    alleMedia.push({ 
                        url: foto.url, datumRuw: new Date(foto.datum), titel: subtitel, matchId: null, 
                        recordId: foto.id, type: 'extra', isVideo: false, tags: getBadgeHtml('Extra'), ruweOpmerking: foto.opmerking || ''
                    });
                });

                if (videoRes && videoRes.data) {
                    videoRes.data.forEach(vid => {
                        const subtitel = vid.opmerking ? `🎥 ${vid.opmerking}` : `🎥 Video / Extra`;
                        alleMedia.push({ 
                            url: vid.url, datumRuw: new Date(vid.datum), titel: subtitel, matchId: null, 
                            recordId: vid.id, type: 'extra', isVideo: true, tags: getBadgeHtml('Extra'), ruweOpmerking: vid.opmerking || ''
                        });
                    });
                }

                alleMedia.sort((a, b) => b.datumRuw - a.datumRuw);
                alleFotosGlobal = alleMedia;

                if (alleMedia.length === 0) {
                    container.innerHTML = '<p class="empty-state">Er is nog geen media geüpload voor deze speler.</p>';
                    return;
                }

                const geclusterdeFotos = {};
                const orderOfKeys = [];

                alleMedia.forEach((media, index) => {
                    const datumVoluit = media.datumRuw.toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' });
                    const groupKey = `${datumVoluit}___${media.titel}`;
                    
                    if (!geclusterdeFotos[groupKey]) {
                        geclusterdeFotos[groupKey] = { datum: datumVoluit, titel: media.titel, fotos: [] };
                        orderOfKeys.push(groupKey);
                    }
                    geclusterdeFotos[groupKey].fotos.push({ ...media, globalIndex: index });
                });

                let html = '';
                orderOfKeys.forEach((key, groupIndex) => {
                    const groep = geclusterdeFotos[key];
                    groepenGlobal.push(groep); // Sla op in de globale lijst zodat we ze kunnen wissen
                    
                    html += `
                        <div style="margin-top: 30px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h3 style="margin: 0 0 4px 0; font-size: 16px; font-weight: 800; color: #1e293b;">${groep.titel}</h3>
                                <span style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">${groep.datum}</span>
                            </div>
                            <button onclick="verwijderGroep(${groupIndex})" style="background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.2); width: 32px; height: 32px; border-radius: 50%; color: #dc2626; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" title="Verwijder deze volledige reeks">🗑️</button>
                        </div>
                    `;

                    html += `<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 4px; border-radius: 12px; overflow: hidden;">`;
                    
                    groep.fotos.forEach(media => {
                        let innerMedia = '';
                        if (media.isVideo) {
                            innerMedia = `
                                <video src="${media.url}#t=0.1" preload="metadata" muted playsinline style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'"></video>
                                <span style="position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.6); color: white; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
                            `;
                        } else {
                            innerMedia = `<img src="${media.url}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">`;
                        }

                        html += `
                            <div onclick="openLightbox(${media.globalIndex})" style="position: relative; aspect-ratio: 1; background: #e5e7eb; cursor: pointer; overflow: hidden;">
                                ${innerMedia}
                            </div>
                        `;
                    });

                    html += `</div>`;
                });

                container.innerHTML = html;

            } catch (err) { container.innerHTML = '<p class="empty-state">Fout bij ophalen van media.</p>'; }
        }

        window.wisselSpeler = function(evt, speler) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            if (speler === 'Lou') { document.documentElement.style.setProperty('--brand-color', '#F34213'); } 
            else { document.documentElement.style.setProperty('--brand-color', '#ef476f'); }
            laadFotos(speler);
        };

        // --- VERWIJDER VOLLEDIGE GROEP ---
        window.verwijderGroep = async function(groupIndex) {
            const groep = groepenGlobal[groupIndex];
            if (!groep || groep.fotos.length === 0) return;

            const pin = prompt("Voer pincode in om deze volledige reeks (" + groep.fotos.length + " items) in één keer te wissen:");
            if (pin !== "0204") {
                if (pin !== null) alert("Onjuiste code.");
                return;
            }

            if (!confirm(`Zeker dat je ALLE ${groep.fotos.length} foto's/video's van "${groep.titel}" (${groep.datum}) definitief wil wissen?`)) return;

            document.body.style.cursor = 'wait'; // Toon dat we aan het laden zijn

            try {
                let matchUpdates = {}; 
                
                for (let media of groep.fotos) {
                    // 1. Verwijder uit database tabellen
                    if (media.type === 'extra') {
                        const table = media.isVideo ? 'extra_videos' : 'extra_fotos';
                        await supabaseClient.from(table).delete().eq('id', media.recordId);
                    } else if (media.type === 'match') {
                        matchUpdates[media.matchId] = true;
                    }
                    
                    // 2. Verwijder bestand uit de storage map
                    try {
                        const pad = media.url.split('/public/media/')[1]; 
                        if(pad) await supabaseClient.storage.from('media').remove([pad]);
                    } catch(e) { console.warn("Kon bestand niet wissen uit storage", e); }
                }

                // 3. Voor matches: de volledige array leegmaken in de 'wedstrijden' tabel
                for (let matchId in matchUpdates) {
                    await supabaseClient.from('wedstrijden').update({ fotos: [] }).eq('id', matchId);
                }

                document.body.style.cursor = 'default';
                laadFotos(huidigeSpeler); 
            } catch (err) { 
                document.body.style.cursor = 'default';
                alert("Fout bij verwijderen van de reeks."); 
            }
        };

        // --- LIGHTBOX LOGICA ---

        window.openLightbox = function(index) {
            currentLbIndex = index;
            updateLightboxUI();
            
            const lb = document.getElementById('lightbox');
            lb.style.display = 'flex';
            setTimeout(() => { lb.style.opacity = '1'; }, 10);
            document.body.style.overflow = 'hidden'; 
        };

        window.updateLightboxUI = function() {
            if (alleFotosGlobal.length === 0) return;
            const media = alleFotosGlobal[currentLbIndex];
            const datumMooi = media.datumRuw.toLocaleDateString('nl-BE', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
            
            const imgEl = document.getElementById('lb-img');
            const vidEl = document.getElementById('lb-video');
            
            imgEl.style.opacity = '0'; 
            vidEl.style.opacity = '0';
            vidEl.pause();

            setTimeout(() => {
                if (media.isVideo) {
                    imgEl.style.display = 'none';
                    imgEl.src = '';
                    vidEl.style.display = 'block';
                    vidEl.src = media.url;
                    vidEl.style.opacity = '1';
                    vidEl.play().catch(e => console.log("Autoplay kon niet starten."));
                } else {
                    vidEl.style.display = 'none';
                    vidEl.src = '';
                    imgEl.style.display = 'block';
                    imgEl.src = media.url;
                    imgEl.style.opacity = '1'; 
                }
            }, 150);

            document.getElementById('lb-title').innerText = media.titel;
            document.getElementById('lb-date').innerText = datumMooi;
            document.getElementById('lb-counter').innerText = `${currentLbIndex + 1} / ${alleFotosGlobal.length}`;
            document.getElementById('lb-tags').innerHTML = media.tags || ''; 
            
            const linkBtn = document.getElementById('lb-link');
            if (media.matchId && media.matchId !== 'null' && media.matchId !== 'undefined') { 
                linkBtn.style.display = 'inline-block'; 
                linkBtn.href = `match-detail.html?id=${media.matchId}`; 
            } else { 
                linkBtn.style.display = 'none'; 
            }

            document.getElementById('lb-edit-btn').style.display = media.type === 'extra' ? 'flex' : 'none';
            document.getElementById('lb-prev').style.display = currentLbIndex > 0 ? 'flex' : 'none';
            document.getElementById('lb-next').style.display = currentLbIndex < alleFotosGlobal.length - 1 ? 'flex' : 'none';
        };

        window.prevImage = function(e) {
            if (e) e.stopPropagation();
            if (currentLbIndex > 0) { currentLbIndex--; updateLightboxUI(); }
        };

        window.nextImage = function(e) {
            if (e) e.stopPropagation();
            if (currentLbIndex < alleFotosGlobal.length - 1) { currentLbIndex++; updateLightboxUI(); }
        };

        window.closeLightbox = function() {
            const lb = document.getElementById('lightbox');
            lb.style.opacity = '0'; 
            document.getElementById('lb-video').pause();
            setTimeout(() => { 
                lb.style.display = 'none'; 
                document.getElementById('lb-img').src = ''; 
                document.getElementById('lb-video').src = ''; 
            }, 300);
            document.body.style.overflow = 'auto';
        };

        let touchstartX = 0; let touchendX = 0;
        const lightboxElement = document.getElementById('lightbox');

        lightboxElement.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
        lightboxElement.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleSwipe(); }, {passive: true});
        function handleSwipe() {
            if (touchendX < touchstartX - 50) nextImage(); 
            if (touchendX > touchstartX + 50) prevImage(); 
        }

        // --- VERWIJDEREN 1 PER 1 (IN LIGHTBOX) ---

        window.verwijderHuidigeFoto = async function() {
            const media = alleFotosGlobal[currentLbIndex];
            if (!media) return;

            const pin = prompt("Voer pincode in om te wissen:");
            if (pin !== "0204") {
                if (pin !== null) alert("Onjuiste code.");
                return;
            }

            if (!confirm("Zeker dat je deze ene media definitief wil wissen?")) return;

            try {
                if (media.type === 'extra') {
                    const table = media.isVideo ? 'extra_videos' : 'extra_fotos';
                    await supabaseClient.from(table).delete().eq('id', media.recordId);
                } else if (media.type === 'match') {
                    const { data: matchData } = await supabaseClient.from('wedstrijden').select('fotos').eq('id', media.matchId).single();
                    if (matchData && matchData.fotos) {
                        const nieuweFotos = matchData.fotos.filter(url => url !== media.url);
                        await supabaseClient.from('wedstrijden').update({ fotos: nieuweFotos }).eq('id', media.matchId);
                    }
                }
                
                try {
                    const pad = media.url.split('/public/media/')[1]; 
                    if(pad) await supabaseClient.storage.from('media').remove([pad]);
                } catch(e) {}

                closeLightbox();
                laadFotos(huidigeSpeler); 
            } catch (err) { alert("Fout bij verwijderen."); }
        };

        window.bewerkHuidigeFoto = async function() {
            const media = alleFotosGlobal[currentLbIndex];
            if (media.type !== 'extra') return; 

            const pin = prompt("Voer pincode in om te wijzigen:");
            if (pin !== "0204") {
                if (pin !== null) alert("Onjuiste code.");
                return;
            }

            const formatDatum = media.datumRuw.toISOString().split('T')[0];
            const nieuweDatum = prompt("Pas de datum aan (JJJJ-MM-DD):", formatDatum);
            if (!nieuweDatum) return;

            const nieuweOpmerking = prompt("Pas de opmerking aan:", media.ruweOpmerking);
            if (nieuweOpmerking === null) return; 

            try {
                const table = media.isVideo ? 'extra_videos' : 'extra_fotos';
                await supabaseClient.from(table).update({ 
                    datum: nieuweDatum, 
                    opmerking: nieuweOpmerking 
                }).eq('id', media.recordId);
                
                closeLightbox();
                laadFotos(huidigeSpeler);
            } catch(e) { alert("Fout bij wijzigen."); }
        };

        // --- UPLOAD LOGICA ---

        window.openUploadModal = function() {
            const pin = prompt("Voer pincode in:");
            if (pin === "0204") {
                document.getElementById('extra-datum').valueAsDate = new Date();
                document.getElementById('extra-opmerking').value = ""; 
                document.getElementById('upload-modal').style.display = 'flex';
                setTimeout(() => document.getElementById('upload-modal-content').style.transform = 'translateY(0)', 10);
            } else if (pin !== null) alert("Onjuiste code.");
        };

        window.closeUploadModal = function() {
            document.getElementById('upload-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => document.getElementById('upload-modal').style.display = 'none', 300);
        };

        window.saveExtraFotos = async function() {
            const files = document.getElementById('extra-fotos').files;
            const datum = document.getElementById('extra-datum').value;
            const opmerking = document.getElementById('extra-opmerking').value;
            
            if(files.length === 0) return alert("Kies eerst een bestand!");

            const btn = document.getElementById('upload-btn');
            btn.innerText = "Bezig met uploaden... ⏳"; btn.disabled = true;

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const isVideo = file.type.startsWith('video/');

                    btn.innerText = `Bestand ${i + 1}/${files.length} uploaden...`;

                    let uploadFile = file;
                    let dbTable = 'extra_fotos';
                    let folder = 'extra';

                    if (isVideo) {
                        dbTable = 'extra_videos';
                        folder = 'videos';
                    } else {
                        const compressieOpties = { maxSizeMB: 2, maxWidthOrHeight: 2560, useWebWorker: true, initialQuality: 0.9 };
                        uploadFile = await imageCompression(file, compressieOpties);
                    }

                    const nameParts = file.name.split('.');
                    const ext = nameParts.length > 1 ? nameParts.pop() : (isVideo ? 'mp4' : 'jpg');
                    const cleanName = file.name.replace(/[^a-zA-Z0-9]/g, '').substring(0, 15);
                    const bestandsNaam = `${folder}/${Date.now()}-${cleanName}.${ext}`;
                    
                    const { error: uploadError } = await supabaseClient.storage.from('media').upload(bestandsNaam, uploadFile);
                    if (uploadError) throw uploadError;
                    
                    const { data: publicUrlData } = supabaseClient.storage.from('media').getPublicUrl(bestandsNaam);
                    
                    await supabaseClient.from(dbTable).insert([{
                        speler: huidigeSpeler, datum: datum, url: publicUrlData.publicUrl, opmerking: opmerking
                    }]);
                }
                closeUploadModal();
                btn.innerText = "Uploaden"; btn.disabled = false;
                document.getElementById('extra-fotos').value = "";
                laadFotos(huidigeSpeler); 
            } catch (e) {
                alert("Fout bij uploaden.");
                btn.innerText = "Uploaden"; btn.disabled = false;
            }
        };

        document.addEventListener('DOMContentLoaded', () => laadFotos('Lou'));
    </script>
</body>
</html>
