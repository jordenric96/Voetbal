<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <!-- Diepe, luxueuze achtergrond gradient (iOS App Icon style) -->
        <radialGradient id="bg-glow" cx="50%" cy="0%" r="100%">
            <stop offset="0%" stop-color="#3a3073"/>
            <stop offset="50%" stop-color="#1c1743"/>
            <stop offset="100%" stop-color="#0b0822"/>
        </radialGradient>

        <!-- 3D Metallic Goud Gradient -->
        <linearGradient id="gold-metal" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#B8860B"/>
            <stop offset="30%" stop-color="#FFD700"/>
            <stop offset="50%" stop-color="#FFF8DC"/>
            <stop offset="70%" stop-color="#FFD700"/>
            <stop offset="100%" stop-color="#DAA520"/>
        </linearGradient>

        <!-- Donker metallic voor de binnenkant van het schild -->
        <linearGradient id="dark-metal" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a2a4a"/>
            <stop offset="100%" stop-color="#111122"/>
        </linearGradient>

        <!-- Drop shadow voor intense diepte -->
        <filter id="shadow-heavy" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
        
        <!-- Subtiele schaduw voor tekst en bal -->
        <filter id="shadow-light" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
        </filter>
    </defs>

    <!-- Achtergrond van de App Icon -->
    <rect width="512" height="512" fill="url(#bg-glow)"/>

    <!-- Subtiele radar/sunburst lijnen in de achtergrond -->
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.04">
        <line x1="256" y1="0" x2="256" y2="512"/>
        <line x1="0" y1="256" x2="512" y2="256"/>
        <line x1="0" y1="0" x2="512" y2="512"/>
        <line x1="0" y1="512" x2="512" y2="0"/>
        <circle cx="256" cy="256" r="150" fill="none"/>
        <circle cx="256" cy="256" r="250" fill="none"/>
    </g>

    <!-- Het Gouden Schild (Crest) -->
    <g filter="url(#shadow-heavy)">
        <!-- Buitenste dikke gouden rand -->
        <path d="M256,40 L440,90 C440,280 350,420 256,470 C162,420 72,280 72,90 Z" fill="url(#dark-metal)" stroke="url(#gold-metal)" stroke-width="16" stroke-linejoin="round"/>
        <!-- Binnenste fijne gouden lijn -->
        <path d="M256,65 L415,108 C415,270 335,395 256,440 C177,395 97,270 97,108 Z" fill="none" stroke="url(#gold-metal)" stroke-width="3" opacity="0.8"/>
    </g>

    <!-- De Premium Voetbal -->
    <g transform="translate(256, 220) scale(1.6)" filter="url(#shadow-light)">
        <!-- Witte basis van de bal met lichte kleur -->
        <circle cx="0" cy="0" r="45" fill="#f8f9fa"/>
        
        <!-- Klassiek voetbal patroon (Pentagon & geometrische lijnen) -->
        <g stroke="#1a1a2e" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
            <!-- Centrale donkere vlak -->
            <polygon points="0,-18 17,-5 10,15 -10,15 -17,-5" fill="#1a1a2e"/>
            
            <!-- Lijnen vanuit het centrum -->
            <line x1="0" y1="-18" x2="0" y2="-45"/>
            <line x1="17" y1="-5" x2="40" y2="-15"/>
            <line x1="-17" y1="-5" x2="-40" y2="-15"/>
            <line x1="10" y1="15" x2="25" y2="38"/>
            <line x1="-10" y1="15" x2="-25" y2="38"/>
            
            <!-- Buitenste connecties (geeft een 3D bolling effect) -->
            <path d="M40,-15 L33,26 M-40,-15 L-33,26" fill="none"/>
            <path d="M25,38 L0,45 L-25,38" fill="none"/>
            <path d="M0,-45 L22,-39 M0,-45 L-22,-39" fill="none"/>
        </g>
    </g>

    <!-- Tekst / Typografie -->
    <g filter="url(#shadow-light)">
        <!-- Hoofdtekst -->
        <text x="256" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">LOU &amp; NOÉ</text>
        
        <!-- Gouden Lintje voor de subtitel -->
        <path d="M 130 405 Q 256 415 382 405 L 370 435 Q 256 445 142 435 Z" fill="url(#gold-metal)"/>
        <text x="256" y="428" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" fill="#1a1a2e" text-anchor="middle" letter-spacing="6">PRO STATS</text>
    </g>
    
    <!-- Glanzende overlay (Glass reflection effect) over de rechterhelft van het schild -->
    <path d="M256,40 L440,90 C440,280 350,420 256,470 C256,470 256,40 256,40 Z" fill="#ffffff" opacity="0.06" pointer-events="none"/>
</svg>
