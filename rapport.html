<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seizoensrapport & Jaarboek</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        /* Print-specifieke stijlen voor een strak PDF-jaarboek */
        @media print {
            header, .no-print, .tabs { display: none !important; }
            body { background: #fff !important; color: #000 !important; font-size: 12px; }
            .report-card { box-shadow: none !important; border: 1px solid #cbd5e1 !important; margin-bottom: 15px !important; padding: 15px !important; }
            .page-break { page-break-after: always; }
        }
        
        .report-card { background: #fff; border-radius: 16px; padding: 24px; margin-bottom: 20px; border: 1px solid #e5e7eb; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #f8fafc; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #f1f5f9; }
        .stat-value { font-size: 20px; font-weight: 800; color: #1e293b; display: block; }
        .stat-label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-top: 4px; display: block; }

        /* Dicht fotogrid voor 40-50 foto's per pagina */
        .photo-album-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        @media print {
            .photo-album-grid {
                grid-template-columns: repeat(6, 1fr); /* Nog compacter voor print */
                gap: 4px;
            }
        }
        .photo-thumb {
            position: relative;
            aspect-ratio: 1;
            background: #f1f5f9;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #e5e7eb;
            break-inside: avoid;
        }
        .photo-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .photo-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 7px;
            padding: 2px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <header class="no-print">
        <h1>Jaarboek</h1>
        <nav>
            <a href="index.html">Overzicht</a>
            <a href="stats.html">Stats</a>
            <a href="ploegen.html">Ploegen</a>
            <a href="galerij.html">Galerij</a>
            <a href="medisch.html">Medisch</a>
        </nav>
    </header>

    <div class="tabs no-print">
        <button class="tab-btn active" onclick="wisselSpeler(event, 'Lou')">Lou</button>
        <button class="tab-btn" onclick="wisselSpeler(event, 'Noé')">Noé</button>
    </div>

    <!-- SELECTIE BALK -->
    <div class="no-print" style="padding: 0 20px 20px 20px;">
        <div style="background: #fff; padding: 16px; border-radius: 16px; border: 1px solid #e5e7eb; display: flex; gap: 12px; align-items: center;">
            <div style="flex: 1;">
                <label style="font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; display: block; margin-bottom: 6px;">Kies Leeftijd / Categorie</label>
                <select id="select-categorie" onchange="genereerRapport()" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e5e7eb; font-weight: 700; background: #f8fafc;">
                    <option value="U6">U6</option>
                    <option value="U7">U7</option>
                    <option value="U8">U8</option>
                    <option value="U9">U9</option>
                    <option value="U10">U10</option>
                    <option value="U11">U11</option>
                    <option value="U12">U12</option>
                    <option value="U13">U13</option>
                    <option value="U14">U14</option>
                    <option value="U15">U15</option>
                    <option value="U16">U16</option>
                    <option value="U17">U17</option>
                    <option value="Beloften">Beloften</option>
                </select>
            </div>
            <button onclick="window.print()" style="background: #1e293b; color: #fff; border: none; padding: 14px 20px; border-radius: 12px; font-weight: 800; cursor: pointer; margin-top: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">📥 Opslaan als PDF</button>
        </div>
    </div>

    <!-- RAPPORT CONTAINER -->
    <main id="rapport-container" style="padding: 0 20px 100px 20px; max-width: 800px; margin: 0 auto;">
        <p class="empty-state">Jaarboek genereren... ⏳</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>

    <script>
        let huidigeSpeler = 'Lou';

        async function genereerRapport() {
            const categorie = document.getElementById('select-categorie').value;
            const container = document.getElementById('rapport-container');
            container.innerHTML = '<p class="empty-state">Gegevens en foto\'s verzamelen... ⏳</p>';

            try {
                // Haal enkel wedstrijden en extra foto's op (geen video's)
                const [matchRes, extraFotoRes] = await Promise.all([
                    supabaseClient.from('wedstrijden').select('*').eq('speler', huidigeSpeler).eq('categorie', categorie),
                    supabaseClient.from('extra_fotos').select('*').eq('speler', huidigeSpeler).eq('categorie', categorie)
                ]);

                if (matchRes.error) throw matchRes.error;

                const matchen = matchRes.data || [];
                const extraFotos = extraFotoRes.data || [];

                let totaalMatchen = 0;
                let totaalWins = 0;
                let totaalGoals = 0;
                let totaalAssists = 0;
                let totaalMinuten = 0;
                let doelmanCount = 0;
                
                let alleFotoUrls = [];

                matchen.forEach(m => {
                    totaalMatchen++;
                    if (m.fotos && m.fotos.length > 0) {
                        m.fotos.forEach(url => {
                            // Filter voor de zekerheid ook hier videobestanden uit de fotolijst
                            const isVid = url.toLowerCase().match(/\.(mp4|mov|mkv|webm)$/) != null;
                            if (!isVid) {
                                alleFotoUrls.push({ url, titel: `vs ${m.tegenstander}` });
                            }
                        });
                    }

                    if (m.mini_scores) {
                        m.mini_scores.forEach(s => {
                            totaalGoals += (s.goals || 0);
                            totaalAssists += (s.assists || 0);
                            totaalMinuten += (s.minuten || 0);
                            if (s.is_doelman) doelmanCount++;

                            let isWin = false;
                            if (s.thuis > s.uit) isWin = m.locatie === 'Thuis';
                            if (s.thuis < s.uit) isWin = m.locatie === 'Uit';
                            if (isWin) totaalWins++;
                        });
                    }
                });

                extraFotos.forEach(f => {
                    alleFotoUrls.push({ url: f.url, titel: f.opmerking || 'Training' });
                });

                const brandColor = huidigeSpeler === 'Lou' ? '#F34213' : '#ef476f';

                let html = `
                    <div class="report-card" style="text-align: center; border-top: 6px solid ${brandColor};">
                        <span style="font-size: 11px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Seizoensoverzicht & Jaarboek</span>
                        <h1 style="font-size: 28px; font-weight: 900; color: #1e293b; margin: 5px 0 5px 0;">${huidigeSpeler}</h1>
                        <span style="display: inline-block; background: ${brandColor}15; color: ${brandColor}; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800;">Categorie: ${categorie}</span>
                    </div>

                    <div class="report-card">
                        <h3 style="font-size: 14px; font-weight: 800; color: #1e293b; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 0.5px;">📊 Seizoensstatistieken</h3>
                        <div class="stat-grid">
                            <div class="stat-box"><span class="stat-value">${totaalMatchen}</span><span class="stat-label">Wedstrijden</span></div>
                            <div class="stat-box"><span class="stat-value" style="color: #059669;">${totaalWins}</span><span class="stat-label">Winst</span></div>
                            <div class="stat-box"><span class="stat-value" style="color: #d97706;">${totaalGoals}</span><span class="stat-label">Doelpunten</span></div>
                            <div class="stat-box"><span class="stat-value" style="color: #0284c7;">${totaalAssists}</span><span class="stat-label">Assists</span></div>
                            <div class="stat-box"><span class="stat-value">${totaalMinuten}m</span><span class="stat-label">Minuten</span></div>
                            <div class="stat-box"><span class="stat-value">${doelmanCount}</span><span class="stat-label">Als Keeper</span></div>
                        </div>
                    </div>
                `;

                // Foto-album met compacte weergave (tientallen foto's per pagina)
                html += `
                    <div class="report-card page-break">
                        <h3 style="font-size: 14px; font-weight: 800; color: #1e293b; margin: 0 0 15px 0; text-transform: uppercase; letter-spacing: 0.5px;">📸 Fotogalerij (${alleFotoUrls.length} foto's)</h3>
                `;

                if (alleFotoUrls.length === 0) {
                    html += `<p style="color: #64748b; font-size: 14px;">Geen foto's gevonden voor ${categorie}.</p>`;
                } else {
                    html += `<div class="photo-album-grid">`;
                    alleFotoUrls.forEach(item => {
                        html += `
                            <div class="photo-thumb">
                                <img src="${item.url}" loading="lazy">
                                <div class="photo-caption">${item.titel}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `</div>`;
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = '<p class="empty-state">Fout bij genereren van rapport.</p>';
            }
        }

        window.wisselSpeler = function(evt, speler) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            huidigeSpeler = speler;
            if (speler === 'Lou') { document.documentElement.style.setProperty('--brand-color', '#F34213'); } 
            else { document.documentElement.style.setProperty('--brand-color', '#ef476f'); }
            genereerRapport();
        };

        document.addEventListener('DOMContentLoaded', () => genereerRapport());
    </script>
</body>
</html>
