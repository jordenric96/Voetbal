<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Overzicht</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#f8fafc">
</head>
<body>
    <header>
        <h1>Overzicht</h1>
        <nav>
            <a href="stats.html">Stats</a>
            <a href="ploegen.html">Ploegen</a>
        </nav>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="wisselSpeler(event, 'Lou')">Lou</button>
        <button class="tab-btn" onclick="wisselSpeler(event, 'Noé')">Noé</button>
    </div>

    <main id="wedstrijden-lijst" class="tab-content active" style="padding: 0 20px 120px;">
        <p class="empty-state">Gegevens laden...</p>
    </main>

    <a href="add-match.html" class="fab-btn">+ Match</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>

    <script>
        async function laadWedstrijden(speler) {
            const container = document.getElementById('wedstrijden-lijst');
            container.innerHTML = '<p class="empty-state">Laden...</p>';

            try {
                const { data: matchen, error } = await supabaseClient.from('wedstrijden').select('*').eq('speler', speler).neq('status', 'Afwezig').order('datum', { ascending: false });
                if (error) throw error;
                if (matchen.length === 0) { container.innerHTML = `<div class="empty-state">Geen wedstrijden voor ${speler}.</div>`; return; }

                let html = '';
                matchen.forEach(match => {
                    const datumMooi = new Date(match.datum).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short' });
                    const isToernooi = match.type_wedstrijd === 'Toernooi';
                    let cardHeaderHtml = isToernooi ? match.tegenstander : `${match.eigen_ploeg || 'Eigen Ploeg'} vs ${match.tegenstander}`;

                    let subMatchesHtml = '';
                    if (match.mini_scores && match.mini_scores.length > 0) {
                        match.mini_scores.forEach((score) => {
                            let statusClass = 'bg-draw color-draw';
                            if (score.thuis > score.uit) statusClass = match.locatie === 'Thuis' ? 'win' : 'loss';
                            if (score.thuis < score.uit) statusClass = match.locatie === 'Thuis' ? 'loss' : 'win';
                            
                            let bgStatus = statusClass === 'win' ? 'var(--bg-win)' : (statusClass === 'loss' ? 'var(--bg-loss)' : 'var(--bg-draw)');
                            let colorStatus = statusClass === 'win' ? 'var(--accent-win)' : (statusClass === 'loss' ? 'var(--accent-loss)' : 'var(--accent-draw)');

                            let subTeamNaam = score.tegenstander || match.tegenstander || "Onbekend";
                            let subLogoHtml = score.logo_tegenstander ? `<img src="${score.logo_tegenstander}" class="sub-match-logo">` : (match.logo_tegenstander ? `<img src="${match.logo_tegenstander}" class="sub-match-logo">` : `<div class="sub-match-logo" style="display:flex;align-items:center;justify-content:center;font-size:10px;">🛡️</div>`);

                            subMatchesHtml += `
                                <div class="sub-match-line">
                                    <div class="sub-match-team">
                                        ${subLogoHtml}
                                        <span class="sub-match-name">${subTeamNaam}</span>
                                    </div>
                                    <div class="sub-match-score" style="background: ${bgStatus}; color: ${colorStatus};">
                                        ${score.thuis} - ${score.uit}
                                    </div>
                                </div>
                            `;
                        });
                    }

                    html += `
                        <a href="match-detail.html?id=${match.id}" class="card">
                            <div style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: flex-start;">
                                <div style="flex: 1; padding-right: 10px;">
                                    <span style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase; letter-spacing: 0.5px;">${datumMooi}</span>
                                    <h3 style="margin: 4px 0 0 0; font-size: 16px; font-weight: 800; color: var(--primary); line-height: 1.2;">${cardHeaderHtml}</h3>
                                </div>
                                <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                                    <span style="font-size: 10px; font-weight: 800; background: #e2e8f0; color: var(--secondary); padding: 4px 8px; border-radius: 6px;">${match.categorie || 'U6'}</span>
                                    ${isToernooi ? `<span style="font-size: 10px; font-weight: 800; background: var(--primary); color: #fff; padding: 4px 8px; border-radius: 6px;">TOERNOOI</span>` : ''}
                                </div>
                            </div>
                            <div>
                                ${subMatchesHtml || '<div style="padding: 16px 20px; font-size: 13px; color: var(--secondary); text-align: center;">Geen data ingegeven</div>'}
                            </div>
                        </a>
                    `;
                });
                container.innerHTML = html;
            } catch (err) { container.innerHTML = '<p class="empty-state">Fout bij laden.</p>'; }
        }

        window.wisselSpeler = function(evt, speler) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.currentTarget.classList.add('active'); laadWedstrijden(speler);
        };
        document.addEventListener('DOMContentLoaded', () => laadWedstrijden('Lou'));
    </script>
</body>
</html>
