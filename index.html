<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voetbal App</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#f1f5f9">
</head>
<body>
    <header>
        <h1>Overzicht</h1>
        <nav>
            <a href="stats.html">Stats</a>
            <a href="ploegen.html">Ploegen</a>
        </nav>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="wisselSpeler(event, 'Lou')">Lou</button>
        <button class="tab-btn" onclick="wisselSpeler(event, 'Noé')">Noé</button>
    </div>

    <!-- FILTER BALK -->
    <div class="filter-bar">
        <span style="font-size: 12px; font-weight: 700; color: #9ca3af;">Filter wedstrijden</span>
        <div class="filter-toggle" onclick="toggleFilter()">
            <span id="filter-indicator">Alle</span>
            <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        
        <div id="filter-panel" class="filter-panel">
            <div class="filter-section-title">Leeftijd / Categorie</div>
            <div id="filter-chips-leeftijd" class="filter-chips-container"></div>
            
            <div class="filter-section-title">Type Wedstrijd</div>
            <div id="filter-chips-type" class="filter-chips-container"></div>
            
            <button onclick="resetFilters()" style="width: 100%; padding: 12px; border-radius: 8px; background: #f3f4f6; border: none; color: #4b5563; font-weight: 700; cursor: pointer;">Filters Wissen</button>
        </div>
    </div>

    <main id="wedstrijden-lijst" class="tab-content active" style="padding: 0 20px 120px 20px;">
        <p class="empty-state">Gegevens laden...</p>
    </main>

    <a href="add-match.html" class="fab-btn">+ Match</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>

    <script>
        // HET KLEUREN BREIN (Zachte Premium Pastelkleuren)
        const badgeColors = {
            'U6': { bg: '#fef08a', text: '#713f12' }, // Zacht vuil geel
            'U7': { bg: '#fed7aa', text: '#7c2d12' }, // Zacht oranje
            'U8': { bg: '#fecaca', text: '#7f1d1d' }, // Zacht rood
            'U9': { bg: '#fbcfe8', text: '#831843' }, // Zacht roze
            'U10': { bg: '#e9d5ff', text: '#581c87' }, // Zacht paars
            'U11': { bg: '#c7d2fe', text: '#312e81' }, // Indigo
            'U12': { bg: '#bae6fd', text: '#0c4a6e' }, // Lichtblauw
            'U13': { bg: '#99f6e4', text: '#0f766e' }, // Teal
            'U14': { bg: '#bbf7d0', text: '#14532d' }, // Groen
            'U15': { bg: '#d9f99d', text: '#3f6212' }, // Lime
            'U16': { bg: '#fef08a', text: '#713f12' }, // Hergebruik
            'U17': { bg: '#fed7aa', text: '#7c2d12' }, 
            'Competitie': { bg: '#e0f2fe', text: '#0369a1' }, // Blauw
            'Toernooi': { bg: '#f3e8ff', text: '#7e22ce' }, // Paars
            'Vriendschappelijk': { bg: '#dcfce7', text: '#15803d' }, // Groen
            'Standaard': { bg: '#f3f4f6', text: '#4b5563' } // Grijs
        };

        function getBadgeHtml(waarde) {
            if (!waarde) return '';
            const style = badgeColors[waarde] || badgeColors['Standaard'];
            return `<span style="font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; background: ${style.bg}; color: ${style.text}; border: 1px solid ${style.bg};">${waarde}</span>`;
        }

        // FILTER STATE
        let actieveSpeler = 'Lou';
        let filterCategorie = null;
        let filterType = null;
        let alleMatchenDB = [];

        function toggleFilter() {
            document.getElementById('filter-panel').classList.toggle('open');
        }

        function resetFilters() {
            filterCategorie = null; filterType = null;
            document.getElementById('filter-panel').classList.remove('open');
            renderWedstrijden(); buildFilterUI();
        }

        function setFilter(soort, waarde) {
            if (soort === 'cat') filterCategorie = (filterCategorie === waarde) ? null : waarde;
            if (soort === 'type') filterType = (filterType === waarde) ? null : waarde;
            renderWedstrijden(); buildFilterUI();
        }

        function buildFilterUI() {
            const catContainer = document.getElementById('filter-chips-leeftijd');
            const typeContainer = document.getElementById('filter-chips-type');
            catContainer.innerHTML = ''; typeContainer.innerHTML = '';

            const leeftijden = ['U6', 'U7', 'U8', 'U9', 'U10', 'U11', 'U12', 'U13'];
            const types = ['Competitie', 'Toernooi', 'Vriendschappelijk'];

            leeftijden.forEach(cat => {
                const style = badgeColors[cat] || badgeColors['Standaard'];
                const isActive = filterCategorie === cat ? 'active' : '';
                catContainer.innerHTML += `<div class="filter-chip ${isActive}" onclick="setFilter('cat', '${cat}')" style="background: ${style.bg}; color: ${style.text}; border-color: ${isActive ? style.text : 'transparent'};">${cat}</div>`;
            });

            types.forEach(type => {
                const style = badgeColors[type] || badgeColors['Standaard'];
                const isActive = filterType === type ? 'active' : '';
                typeContainer.innerHTML += `<div class="filter-chip ${isActive}" onclick="setFilter('type', '${type}')" style="background: ${style.bg}; color: ${style.text}; border-color: ${isActive ? style.text : 'transparent'};">${type}</div>`;
            });

            // Update Indicator Text
            let indText = "Alle";
            if(filterCategorie && filterType) indText = `${filterCategorie} & ${filterType}`;
            else if(filterCategorie) indText = filterCategorie;
            else if(filterType) indText = filterType;
            document.getElementById('filter-indicator').innerText = indText;
        }

        async function laadWedstrijden(speler) {
            actieveSpeler = speler;
            document.getElementById('wedstrijden-lijst').innerHTML = '<p class="empty-state">Laden...</p>';
            try {
                const { data: matchen, error } = await supabaseClient.from('wedstrijden').select('*').eq('speler', speler).neq('status', 'Afwezig').order('datum', { ascending: false });
                if (error) throw error;
                alleMatchenDB = matchen;
                buildFilterUI();
                renderWedstrijden();
            } catch (err) { document.getElementById('wedstrijden-lijst').innerHTML = '<p class="empty-state">Fout bij laden.</p>'; }
        }

        function renderWedstrijden() {
            const container = document.getElementById('wedstrijden-lijst');
            
            // Toepassen van de filters!
            let tonenMatchen = alleMatchenDB;
            if (filterCategorie) tonenMatchen = tonenMatchen.filter(m => m.categorie === filterCategorie);
            if (filterType) tonenMatchen = tonenMatchen.filter(m => m.type_wedstrijd === filterType);

            if (tonenMatchen.length === 0) {
                container.innerHTML = `<div class="empty-state">Geen wedstrijden gevonden voor deze filters.</div>`; return;
            }

            let gespeeldSpeler = 0; let gespeeldDoelman = 0; let goals = 0; let assists = 0;
            tonenMatchen.forEach(m => {
                if (m.mini_scores) {
                    m.mini_scores.forEach(score => {
                        if (score.is_doelman) gespeeldDoelman++; else gespeeldSpeler++;
                        goals += (score.goals || 0); assists += (score.assists || 0);
                    });
                }
            });

            let html = `
                <div style="background: #ffffff; border-radius: 16px; padding: 20px 10px; display: flex; justify-content: space-between; text-align: center; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
                    <div style="flex: 1; border-right: 1px solid #f1f5f9;">
                        <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${gespeeldSpeler}</span>
                        <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Speler</span>
                    </div>
                    <div style="flex: 1; border-right: 1px solid #f1f5f9;">
                        <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${gespeeldDoelman}</span>
                        <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Keeper</span>
                    </div>
                    <div style="flex: 1; border-right: 1px solid #f1f5f9;">
                        <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${goals}</span>
                        <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Goals</span>
                    </div>
                    <div style="flex: 1;">
                        <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${assists}</span>
                        <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Assists</span>
                    </div>
                </div>
            `;

            tonenMatchen.forEach(match => {
                const datumMooi = new Date(match.datum).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short' }).toUpperCase();
                const isToernooi = match.type_wedstrijd === 'Toernooi';
                
                let badges = `
                    ${getBadgeHtml(match.categorie)}
                    ${getBadgeHtml(match.type_wedstrijd)}
                `;

                let subMatchesHtml = '';
                if (match.mini_scores && match.mini_scores.length > 0) {
                    match.mini_scores.forEach((score) => {
                        let statusClass = 'draw';
                        if (score.thuis > score.uit) statusClass = match.locatie === 'Thuis' ? 'win' : 'loss';
                        if (score.thuis < score.uit) statusClass = match.locatie === 'Thuis' ? 'loss' : 'win';
                        
                        let bgStatus = statusClass === 'win' ? '#ecfdf5' : (statusClass === 'loss' ? '#fef2f2' : '#f3f4f6');
                        let colorStatus = statusClass === 'win' ? '#059669' : (statusClass === 'loss' ? '#dc2626' : '#4b5563');

                        let subTeamNaam = score.tegenstander || match.tegenstander || "Onbekend";
                        let subLogoHtml = score.logo_tegenstander ? `<img src="${score.logo_tegenstander}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;">` : (match.logo_tegenstander ? `<img src="${match.logo_tegenstander}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;">` : `<div style="width:24px; height:24px; border-radius:50%; background:#e5e7eb;"></div>`);

                        subMatchesHtml += `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f9fafb;">
                                <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                                    ${subLogoHtml}
                                    <span style="font-size: 14px; font-weight: 600; color: #374151; white-space: normal; word-break: break-word;">${subTeamNaam}</span>
                                </div>
                                <div style="font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 6px; background: ${bgStatus}; color: ${colorStatus};">
                                    ${score.thuis} - ${score.uit}
                                </div>
                            </div>
                        `;
                    });
                }

                html += `
                    <a href="match-detail.html?id=${match.id}" class="match-card-v2">
                        <div class="card-meta-row">
                            <span style="font-size: 10px; font-weight: 700; color: #9ca3af; letter-spacing: 0.5px;">${datumMooi}</span>
                            <div style="display: flex; gap: 6px;">${badges}</div>
                        </div>
                        
                        <h3 style="margin: 0 0 16px 0; font-size: 19px; font-weight: 800; color: #111827; letter-spacing: -0.2px;">
                            ${isToernooi ? match.tegenstander : (match.eigen_ploeg + ' vs ' + match.tegenstander)}
                        </h3>

                        <div class="sub-matches-list" style="border-top: 1px solid #f1f5f9; margin-top: 5px; padding-top: 5px;">
                            ${subMatchesHtml || '<div style="font-size: 13px; color: #9ca3af; text-align: center; padding: 10px 0;">Geen uitslagen</div>'}
                        </div>
                    </a>
                `;
            });
            container.innerHTML = html;
        }

        window.wisselSpeler = function(evt, speler) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            laadWedstrijden(speler);
        };
        document.addEventListener('DOMContentLoaded', () => laadWedstrijden('Lou'));
    </script>
</body>
</html>
