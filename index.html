<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voetbal App</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#f1f5f9">
</head>
<body>
    <header>
        <h1>Overzicht</h1>
        <nav>
            <a href="stats.html">Stats</a>
            <a href="ploegen.html">Ploegen</a>
        </nav>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="wisselSpeler(event, 'Lou')">Lou</button>
        <button class="tab-btn" onclick="wisselSpeler(event, 'Noé')">Noé</button>
    </div>

    <main id="wedstrijden-lijst" class="tab-content active" style="padding: 0 20px 120px 20px;">
        <p class="empty-state">Gegevens laden...</p>
    </main>

    <a href="add-match.html" class="fab-btn">+ Match</a>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>

    <script>
        async function laadWedstrijden(speler) {
            const container = document.getElementById('wedstrijden-lijst');
            container.innerHTML = '<p class="empty-state">Laden...</p>';

            try {
                const { data: matchen, error } = await supabaseClient.from('wedstrijden').select('*').eq('speler', speler).neq('status', 'Afwezig').order('datum', { ascending: false });
                if (error) throw error;
                
                if (matchen.length === 0) {
                    container.innerHTML = `<div class="empty-state">Nog geen wedstrijden voor ${speler}.</div>`; return;
                }

                // QUICK STATS BEREKENEN
                let gespeeldSpeler = 0; let gespeeldDoelman = 0; let goals = 0; let assists = 0;
                matchen.forEach(m => {
                    if (m.mini_scores && m.mini_scores.length > 0) {
                        m.mini_scores.forEach(score => {
                            if (score.is_doelman) gespeeldDoelman++; else gespeeldSpeler++;
                            goals += (score.goals || 0); assists += (score.assists || 0);
                        });
                    }
                });

                // PREMIUM QUICK STATS BALK
                let html = `
                    <div style="background: #ffffff; border-radius: 16px; padding: 20px 10px; display: flex; justify-content: space-between; text-align: center; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
                        <div style="flex: 1; border-right: 1px solid #f1f5f9;">
                            <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${gespeeldSpeler}</span>
                            <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Speler</span>
                        </div>
                        <div style="flex: 1; border-right: 1px solid #f1f5f9;">
                            <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${gespeeldDoelman}</span>
                            <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Keeper</span>
                        </div>
                        <div style="flex: 1; border-right: 1px solid #f1f5f9;">
                            <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${goals}</span>
                            <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Goals</span>
                        </div>
                        <div style="flex: 1;">
                            <span style="display: block; font-size: 20px; font-weight: 800; color: #111827;">${assists}</span>
                            <span style="display: block; font-size: 9px; font-weight: 700; color: #6b7280; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px;">Assists</span>
                        </div>
                    </div>
                `;

                // WEDSTRIJDKAARTJES
                matchen.forEach(match => {
                    const datumMooi = new Date(match.datum).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short' }).toUpperCase();
                    const isToernooi = match.type_wedstrijd === 'Toernooi';
                    
                    let badges = `
                        <span class="card-badge">${match.categorie || 'U6'}</span>
                        ${isToernooi ? `<span class="card-badge" style="border-color: #111827; color: #111827;">Toernooi</span>` : ''}
                    `;

                    let subMatchesHtml = '';
                    if (match.mini_scores && match.mini_scores.length > 0) {
                        match.mini_scores.forEach((score) => {
                            let statusClass = 'draw';
                            if (score.thuis > score.uit) statusClass = match.locatie === 'Thuis' ? 'win' : 'loss';
                            if (score.thuis < score.uit) statusClass = match.locatie === 'Thuis' ? 'loss' : 'win';
                            
                            let bgStatus = statusClass === 'win' ? '#ecfdf5' : (statusClass === 'loss' ? '#fef2f2' : '#f3f4f6');
                            let colorStatus = statusClass === 'win' ? '#059669' : (statusClass === 'loss' ? '#dc2626' : '#4b5563');

                            let subTeamNaam = score.tegenstander || match.tegenstander || "Onbekend";
                            let subLogoHtml = score.logo_tegenstander ? `<img src="${score.logo_tegenstander}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;">` : (match.logo_tegenstander ? `<img src="${match.logo_tegenstander}" style="width:24px; height:24px; border-radius:50%; object-fit:cover;">` : `<div style="width:24px; height:24px; border-radius:50%; background:#e5e7eb;"></div>`);

                            subMatchesHtml += `
                                <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f9fafb;">
                                    <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
                                        ${subLogoHtml}
                                        <span style="font-size: 14px; font-weight: 600; color: #374151; white-space: normal; word-break: break-word;">${subTeamNaam}</span>
                                    </div>
                                    <div style="font-weight: 700; font-size: 13px; padding: 4px 10px; border-radius: 6px; background: ${bgStatus}; color: ${colorStatus};">
                                        ${score.thuis} - ${score.uit}
                                    </div>
                                </div>
                            `;
                        });
                    }

                    html += `
                        <a href="match-detail.html?id=${match.id}" class="match-card-v2">
                            <div class="card-meta-row">
                                <span style="font-size: 10px; font-weight: 700; color: #9ca3af; letter-spacing: 0.5px;">${datumMooi}</span>
                                <div style="display: flex; gap: 6px;">${badges}</div>
                            </div>
                            
                            <h3 style="margin: 0 0 16px 0; font-size: 19px; font-weight: 800; color: #111827; letter-spacing: -0.2px;">
                                ${isToernooi ? match.tegenstander : (match.eigen_ploeg + ' vs ' + match.tegenstander)}
                            </h3>

                            <div class="sub-matches-list" style="border-top: 1px solid #f1f5f9; margin-top: 5px; padding-top: 5px;">
                                ${subMatchesHtml || '<div style="font-size: 13px; color: #9ca3af; text-align: center; padding: 10px 0;">Geen uitslagen</div>'}
                            </div>
                        </a>
                    `;
                });
                container.innerHTML = html;
            } catch (err) { container.innerHTML = '<p class="empty-state">Fout bij laden.</p>'; }
        }

        window.wisselSpeler = function(evt, speler) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            laadWedstrijden(speler);
        };
        document.addEventListener('DOMContentLoaded', () => laadWedstrijden('Lou'));
    </script>
</body>
</html>
