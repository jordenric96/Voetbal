<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Voetbal Tracker</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <header>
        <h1>Overzicht</h1>
        <nav>
            <a href="index.html" class="active">Overzicht</a>
            <a href="stats.html">Stats</a>
            <a href="galerij.html">Galerij</a>
            <a href="medisch.html">Medisch</a>
            <a href="rapport.html">Jaarboek</a>
            <a href="ploegen.html">Ploegen</a>
        </nav>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="wisselSpeler(event, 'Lou')">Lou</button>
        <button class="tab-btn" onclick="wisselSpeler(event, 'Noé')">Noé</button>
    </div>

    <!-- SEIZOEN FILTER -->
    <div style="padding: 0 20px 10px 20px; display: flex; gap: 8px; overflow-x: auto; -ms-overflow-style: none; scrollbar-width: none;" id="seizoen-filter-container">
        <!-- Dynamisch gevuld door JS -->
    </div>

    <!-- HOOFD INHOUD OVERZICHT -->
    <main id="match-list" style="padding: 0 20px 100px 20px;">
        <p class="empty-state">Wedstrijden inladen... ⏳</p>
    </main>

    <!-- ZWEVENDE ACTIE KNOP (FAB) -->
    <button onclick="openVoegToe()" class="fab-btn">⚽ + Match</button>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>
    <!-- De ?v=3 zorgt ervoor dat je gsm verplicht de NIEUWE app.js inlaadt -->
    <script src="js/app.js?v=3"></script>
</body>
</html>
