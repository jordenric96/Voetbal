<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Details</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#f8fafc">
</head>
<body>
    <header>
        <h1>Details</h1>
        <nav><a href="index.html">← Terug</a></nav>
    </header>

    <main id="detail-container" style="padding: 0 20px 100px;">
        <p class="empty-state">Laden...</p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const matchId = urlParams.get('id');
        let actueleMatch = null;

        async function laadMatchDetail() {
            const container = document.getElementById('detail-container');
            
            try {
                const { data: match, error } = await supabaseClient.from('wedstrijden').select('*').eq('id', matchId).single();
                if (error || !match) throw error;
                actueleMatch = match;

                const datumMooi = new Date(match.datum).toLocaleDateString('nl-BE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                const isToernooi = match.type_wedstrijd === 'Toernooi';
                let titelHtml = isToernooi ? match.tegenstander : `${match.eigen_ploeg || 'Eigen Ploeg'} vs ${match.tegenstander}`;

                let totaalGoals = 0; let totaalAssists = 0; let wasKeeper = false;
                if (match.mini_scores) {
                    match.mini_scores.forEach(s => {
                        totaalGoals += (s.goals || 0); totaalAssists += (s.assists || 0);
                        if (s.is_doelman) wasKeeper = true;
                    });
                }

                let html = `
                    <div style="margin-bottom: 25px;">
                        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                            <span style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase;">${datumMooi}</span>
                            <span style="font-size: 11px; font-weight: 800; background: #e2e8f0; color: var(--secondary); padding: 2px 6px; border-radius: 4px;">${match.categorie || 'U6'}</span>
                        </div>
                        <h2 style="margin: 0; font-size: 28px; font-weight: 800; color: var(--primary); line-height: 1.1; letter-spacing: -0.5px;">${titelHtml}</h2>
                    </div>

                    <div class="card" style="display: flex; justify-content: space-around; text-align: center; padding: 20px 10px;">
                        <div style="flex: 1;">
                            <span style="display: block; font-size: 28px; font-weight: 800;">${totaalGoals}</span>
                            <span style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase;">Goals</span>
                        </div>
                        <div style="width: 1px; background: #e2e8f0;"></div>
                        <div style="flex: 1;">
                            <span style="display: block; font-size: 28px; font-weight: 800;">${totaalAssists}</span>
                            <span style="font-size: 11px; font-weight: 700; color: var(--secondary); text-transform: uppercase;">Assists</span>
                        </div>
                    </div>
                `;

                if (match.opmerking) {
                    html += `
                        <div style="background: var(--surface); padding: 16px 20px; border-radius: 12px; margin-bottom: 20px; border-left: 4px solid var(--brand); font-style: italic; color: var(--secondary); font-size: 14px; box-shadow: var(--card-shadow);">
                            "${match.opmerking}"
                        </div>
                    `;
                }

                if (match.mini_scores && match.mini_scores.length > 0) {
                    html += `<h3 style="font-size: 16px; font-weight: 800; margin-bottom: 12px;">Wedstrijden</h3><div class="card" style="padding: 0;">`;
                    
                    match.mini_scores.forEach((score) => {
                        let statusClass = 'draw';
                        if (score.thuis > score.uit) statusClass = match.locatie === 'Thuis' ? 'win' : 'loss';
                        if (score.thuis < score.uit) statusClass = match.locatie === 'Thuis' ? 'loss' : 'win';

                        let bgStatus = statusClass === 'win' ? 'var(--bg-win)' : (statusClass === 'loss' ? 'var(--bg-loss)' : 'var(--bg-draw)');
                        let colorStatus = statusClass === 'win' ? 'var(--accent-win)' : (statusClass === 'loss' ? 'var(--accent-loss)' : 'var(--accent-draw)');
                        
                        let subTeamNaam = score.tegenstander || match.tegenstander || "Onbekend";
                        let subLogoHtml = score.logo_tegenstander ? `<img src="${score.logo_tegenstander}" class="sub-match-logo">` : `<div class="sub-match-logo"></div>`;

                        let spelerDetails = [];
                        if(score.goals > 0) spelerDetails.push(`${score.goals} Goal${score.goals>1?'s':''}`);
                        if(score.assists > 0) spelerDetails.push(`${score.assists} Assist${score.assists>1?'s':''}`);
                        if(score.is_doelman) spelerDetails.push(`Keeper`);
                        let detailsStr = spelerDetails.length > 0 ? spelerDetails.join(' • ') : 'Geen persoonlijke acties';

                        html += `
                            <div style="padding: 16px 20px; border-bottom: 1px solid #f1f5f9;">
                                <div class="sub-match-line" style="padding: 0; border: none; margin-bottom: 8px;">
                                    <div class="sub-match-team">
                                        ${subLogoHtml}
                                        <span class="sub-match-name">${subTeamNaam}</span>
                                    </div>
                                    <div class="sub-match-score" style="background: ${bgStatus}; color: ${colorStatus};">
                                        ${score.thuis} - ${score.uit}
                                    </div>
                                </div>
                                <div style="font-size: 12px; font-weight: 600; color: var(--secondary);">
                                    ${detailsStr}
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }

                html += `
                    <div style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px;">
                        <button onclick="deelViaWhatsApp()" style="background: #25D366; color: #fff; border: none; padding: 16px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer;">Delen via WhatsApp</button>
                        <div style="display: flex; gap: 10px;">
                            <button onclick="bewerkMatch()" class="btn-secondary">Bewerk</button>
                            <button onclick="verwijderMatch()" class="btn-danger">Wis</button>
                        </div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (err) { container.innerHTML = '<p class="empty-state">Fout bij laden.</p>'; }
        }
        
        window.bewerkMatch = function() {
            const pin = prompt("Pincode (0204):");
            if (pin === "0204") window.location.href = `add-match.html?edit=${matchId}`;
        };

        window.verwijderMatch = async function() {
            const pin = prompt("Pincode (0204):");
            if (pin === "0204") {
                if(confirm("Weet je zeker dat je deze dag wil wissen?")) {
                    await supabaseClient.from('wedstrijden').delete().eq('id', matchId);
                    window.location.href = "index.html";
                }
            }
        };

        window.deelViaWhatsApp = function() {
            if (!actueleMatch) return;
            const titel = actueleMatch.type_wedstrijd === 'Toernooi' ? `🏆 Toernooi ${actueleMatch.tegenstander}` : `⚽ ${actueleMatch.eigen_ploeg} VS ${actueleMatch.tegenstander}`;
            let tekst = `*Voetbal Update: ${actueleMatch.speler}*\n${titel}\n\n`;
            window.open(`https://wa.me/?text=${encodeURIComponent(tekst)}`, '_blank');
        };

        document.addEventListener('DOMContentLoaded', laadMatchDetail);
    </script>
</body>
</html>
