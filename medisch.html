<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medisch Dossier</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        /* Specifieke CSS voor het custom PIN toetsenbord */
        .pin-dots-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0 30px 0; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #cbd5e1; transition: all 0.2s ease; }
        .pin-dot.filled { background: #1e293b; border-color: #1e293b; }
        .pin-dot.error { border-color: #dc2626; background: #fef2f2; }
        
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .numpad-btn { background: #f8fafc; border: 1px solid #f1f5f9; font-size: 26px; font-weight: 600; color: #1e293b; border-radius: 50%; width: 70px; height: 70px; margin: 0 auto; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-tap-highlight-color: transparent; }
        .numpad-btn:active { background: #e2e8f0; transform: scale(0.95); }
        .numpad-btn.empty { background: transparent; border: none; cursor: default; }
        .numpad-btn.empty:active { transform: none; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>
    <header>
        <h1>Medisch</h1>
        <nav>
            <a href="index.html">Overzicht</a>
            <a href="stats.html">Stats</a>
            <a href="ploegen.html">Ploegen</a>
            <a href="galerij.html">Galerij</a>
            <a href="medisch.html" class="active">Medisch</a>
        </nav>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="wisselSpeler(event, 'Lou')">Lou</button>
        <button class="tab-btn" onclick="wisselSpeler(event, 'Noé')">Noé</button>
    </div>

    <main id="medisch-lijst" style="padding: 0 20px 120px 20px;">
        <p class="empty-state">Dossier inladen...</p>
    </main>

    <button onclick="openBlessureModal()" class="fab-btn">🏥 + Dossier</button>

    <!-- CUSTOM ON-SCREEN PIN MODAL -->
    <div id="custom-pin-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17,24,39,0.75); backdrop-filter: blur(8px); z-index: 10001; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease;">
        <div style="background: #fff; width: 90%; max-width: 360px; border-radius: 28px; padding: 30px 20px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); transform: scale(0.95); transition: transform 0.2s ease;" id="custom-pin-content">
            <h3 style="margin: 0; font-size: 18px; font-weight: 800; color: #1e293b;">Beveiligde Actie</h3>
            <p style="margin: 6px 0 0 0; font-size: 13px; color: #64748b; font-weight: 600;">Voer je pincode in om verder te gaan.</p>
            
            <div id="pin-dots" class="pin-dots-container">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>

            <div class="numpad-grid">
                <div class="numpad-btn" onclick="addPinDigit('1')">1</div>
                <div class="numpad-btn" onclick="addPinDigit('2')">2</div>
                <div class="numpad-btn" onclick="addPinDigit('3')">3</div>
                <div class="numpad-btn" onclick="addPinDigit('4')">4</div>
                <div class="numpad-btn" onclick="addPinDigit('5')">5</div>
                <div class="numpad-btn" onclick="addPinDigit('6')">6</div>
                <div class="numpad-btn" onclick="addPinDigit('7')">7</div>
                <div class="numpad-btn" onclick="addPinDigit('8')">8</div>
                <div class="numpad-btn" onclick="addPinDigit('9')">9</div>
                <div class="numpad-btn empty"></div>
                <div class="numpad-btn" onclick="addPinDigit('0')">0</div>
                <div class="numpad-btn" style="font-size: 20px; background: #f1f5f9;" onclick="removePinDigit()">⌫</div>
            </div>

            <button onclick="closePinModal()" style="background: transparent; color: #94a3b8; border: none; font-size: 14px; font-weight: 700; padding: 10px; margin-top: 10px; cursor: pointer;">Annuleren</button>
        </div>
    </div>

    <!-- UPLOAD MODAL -->
    <div id="blessure-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17,24,39,0.5); backdrop-filter: blur(5px); z-index: 9000; align-items: flex-end; justify-content: center;">
        <div style="background: #fff; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 30px 20px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s ease; max-height: 90vh; overflow-y: auto;" id="blessure-modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0; font-size: 20px; font-weight: 800;">Nieuwe Blessure</h2>
                <button onclick="closeBlessureModal()" style="background: #f1f5f9; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; color: #64748b;">✕</button>
            </div>
            
            <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Datum Start</label>
                    <input type="date" id="b-datum" required>
                </div>
            </div>

            <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
                <div style="flex: 1;">
                    <label>Lichaamsdeel</label>
                    <select id="b-lichaam">
                        <option value="Knie">Knie</option>
                        <option value="Enkel">Enkel</option>
                        <option value="Spier (Bovenbeen)">Spier (Bovenbeen)</option>
                        <option value="Spier (Kuit)">Spier (Kuit)</option>
                        <option value="Voet">Voet / Tenen</option>
                        <option value="Arm / Pols">Arm / Pols</option>
                        <option value="Hoofd">Hoofd</option>
                        <option value="Ziekte">Ziekte / Algemeen</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>Type Blessure</label>
                    <select id="b-type">
                        <option value="Kneuzing">Kneuzing (Stoot)</option>
                        <option value="Verstuiking">Verstuiking / Omslaan</option>
                        <option value="Overbelasting">Overbelasting</option>
                        <option value="Scheur">Scheur / Breuk</option>
                        <option value="Ziek">Ziek (Koorts/Griep)</option>
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>Diagnose / Opmerking</label>
                <textarea id="b-opmerking" rows="2" placeholder="Hoe is het gebeurd? Advies dokter?"></textarea>
            </div>
            
            <button id="save-btn" onclick="saveBlessure()" class="submit-btn">Toevoegen aan dossier</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>

    <script>
        // --- CUSTOM PIN TOETSENBORD LOGICA ---
        let currentPin = '';
        let pinSuccessCallback = null;

        function requirePin(callback) {
            currentPin = '';
            pinSuccessCallback = callback;
            updatePinDots();
            
            const modal = document.getElementById('custom-pin-modal');
            const content = document.getElementById('custom-pin-content');
            
            modal.style.display = 'flex';
            setTimeout(() => { modal.style.opacity = '1'; content.style.transform = 'scale(1)'; }, 10);
        }

        function closePinModal() {
            const modal = document.getElementById('custom-pin-modal');
            const content = document.getElementById('custom-pin-content');
            
            modal.style.opacity = '0';
            content.style.transform = 'scale(0.95)';
            
            setTimeout(() => { modal.style.display = 'none'; currentPin = ''; pinSuccessCallback = null; }, 200);
        }

        function addPinDigit(digit) {
            if (currentPin.length < 4) {
                currentPin += digit;
                updatePinDots();
                if (currentPin.length === 4) setTimeout(verifyPin, 150); 
            }
        }

        function removePinDigit() {
            if (currentPin.length > 0) { currentPin = currentPin.slice(0, -1); updatePinDots(); }
        }

        function updatePinDots() {
            const dots = document.querySelectorAll('.pin-dot');
            dots.forEach((dot, index) => {
                dot.classList.remove('error'); 
                if (index < currentPin.length) dot.classList.add('filled');
                else dot.classList.remove('filled');
            });
        }

        function verifyPin() {
            if (currentPin === "0204") {
                closePinModal();
                if (pinSuccessCallback) pinSuccessCallback();
            } else {
                const dotsContainer = document.getElementById('pin-dots');
                const dots = document.querySelectorAll('.pin-dot');
                
                dotsContainer.classList.add('shake');
                dots.forEach(dot => { dot.classList.add('error'); dot.classList.remove('filled'); });
                
                setTimeout(() => {
                    dotsContainer.classList.remove('shake');
                    currentPin = '';
                    updatePinDots(); 
                }, 400);
            }
        }

        // --- MEDISCH DOSSIER LOGICA ---
        let huidigeSpeler = 'Lou';

        async function laadDossier(speler) {
            huidigeSpeler = speler;
            const container = document.getElementById('medisch-lijst');
            container.innerHTML = '<p class="empty-state">Laden... ⏳</p>';

            try {
                const { data, error } = await supabaseClient
                    .from('blessures')
                    .select('*')
                    .eq('speler', speler)
                    .order('datum_start', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    container.innerHTML = `
                        <div style="text-align: center; padding: 40px 20px;">
                            <div style="font-size: 40px; margin-bottom: 10px;">🩺</div>
                            <h3 style="font-size: 16px; color: #1e293b; margin: 0 0 5px 0;">Kerngezond!</h3>
                            <p style="font-size: 13px; color: #64748b; margin: 0;">Geen medische historie gevonden voor ${speler}.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                data.forEach(item => {
                    const isHersteld = item.datum_eind !== null;
                    const startMooi = new Date(item.datum_start).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' });
                    const eindMooi = isHersteld ? new Date(item.datum_eind).toLocaleDateString('nl-BE', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Heden';
                    
                    const badgeBg = isHersteld ? '#ecfdf5' : '#fef2f2';
                    const badgeText = isHersteld ? '#059669' : '#dc2626';
                    const badgeBorder = isHersteld ? '#a7f3d0' : '#fecaca';
                    const statusTekst = isHersteld ? 'Hersteld' : 'Actief';

                    html += `
                        <div style="background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #f1f5f9;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px;">
                                <div>
                                    <h3 style="margin: 0 0 4px 0; font-size: 18px; font-weight: 800; color: #1e293b;">${item.lichaamsdeel}</h3>
                                    <span style="font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase;">${item.type_blessure}</span>
                                </div>
                                <span style="background: ${badgeBg}; color: ${badgeText}; border: 1px solid ${badgeBorder}; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase;">${statusTekst}</span>
                            </div>
                            
                            <div style="background: #f8fafc; padding: 12px; border-radius: 12px; font-size: 12px; font-weight: 600; color: #4b5563; margin-bottom: 15px;">
                                📅 <b>Periode:</b> ${startMooi} &rarr; ${eindMooi}
                            </div>
                            
                            ${item.opmerking ? `<p style="font-size: 13px; color: #4b5563; line-height: 1.5; margin: 0 0 15px 0; font-style: italic;">"${item.opmerking}"</p>` : ''}
                            
                            <div style="display: flex; gap: 10px; border-top: 1px solid #f1f5f9; padding-top: 15px;">
                                ${!isHersteld ? `<button onclick="markeerHersteld('${item.id}')" style="flex: 1; background: #059669; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: 700; cursor: pointer;">Zet als Hersteld</button>` : ''}
                                <button onclick="verwijderBlessure('${item.id}')" style="background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; width: 40px; border-radius: 8px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center;">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (err) { container.innerHTML = '<p class="empty-state">Fout bij ophalen dossier.</p>'; }
        }

        window.wisselSpeler = function(evt, speler) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            evt.currentTarget.classList.add('active');
            if (speler === 'Lou') { document.documentElement.style.setProperty('--brand-color', '#F34213'); } 
            else { document.documentElement.style.setProperty('--brand-color', '#ef476f'); }
            laadDossier(speler);
        };

        window.openBlessureModal = function() {
            requirePin(() => {
                document.getElementById('b-datum').valueAsDate = new Date();
                document.getElementById('b-opmerking').value = "";
                document.getElementById('blessure-modal').style.display = 'flex';
                setTimeout(() => document.getElementById('blessure-modal-content').style.transform = 'translateY(0)', 10);
            });
        };

        window.closeBlessureModal = function() {
            document.getElementById('blessure-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => document.getElementById('blessure-modal').style.display = 'none', 300);
        };

        window.saveBlessure = async function() {
            const datum = document.getElementById('b-datum').value;
            const lichaam = document.getElementById('b-lichaam').value;
            const type = document.getElementById('b-type').value;
            const opmerking = document.getElementById('b-opmerking').value;

            const btn = document.getElementById('save-btn');
            btn.innerText = "Bezig... ⏳"; btn.disabled = true;

            try {
                const { error } = await supabaseClient.from('blessures').insert([{
                    speler: huidigeSpeler, datum_start: datum, lichaamsdeel: lichaam, type_blessure: type, opmerking: opmerking
                }]);
                if (error) throw error;
                
                closeBlessureModal();
                btn.innerText = "Toevoegen aan dossier"; btn.disabled = false;
                laadDossier(huidigeSpeler);
            } catch (e) { alert("Fout bij opslaan."); btn.innerText = "Toevoegen"; btn.disabled = false; }
        };

        window.markeerHersteld = function(id) {
            requirePin(async () => {
                const vandaag = new Date().toISOString().split('T')[0];
                await supabaseClient.from('blessures').update({ datum_eind: vandaag }).eq('id', id);
                laadDossier(huidigeSpeler);
            });
        };

        window.verwijderBlessure = function(id) {
            requirePin(async () => {
                if (confirm("Dossierlijn definitief wissen?")) {
                    await supabaseClient.from('blessures').delete().eq('id', id);
                    laadDossier(huidigeSpeler);
                }
            });
        };

        document.addEventListener('DOMContentLoaded', () => laadDossier('Lou'));
    </script>
</body>
</html>
