<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ploegen</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc">
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
    <header>
        <h1>Ploegen</h1>
        <nav>
            <a href="index.html">Overzicht</a>
            <a href="stats.html">Stats</a>
            <a href="ploegen.html" class="active">Ploegen</a>
            <a href="galerij.html">Galerij</a>
            <a href="medisch.html">Medisch</a>
        </nav>
    </header>

    <div style="padding: 0 20px 20px 20px;">
        <div style="position: relative;">
            <svg style="position: absolute; left: 16px; top: 16px; color: #94a3b8; width: 18px; height: 18px;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
            <input type="text" id="searchInput" onkeyup="filterPloegen()" placeholder="Zoek een ploeg..." autocomplete="off" style="width: 100%; padding: 14px 14px 14px 44px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; font-size: 15px; font-weight: 500; color: var(--space-indigo); box-shadow: 0 2px 5px rgba(0,0,0,0.02); outline: none; box-sizing: border-box;">
        </div>
    </div>

    <main id="ploegen-lijst" style="padding: 0 20px 100px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 15px;">
        <p class="empty-state">Ploegen laden...</p>
    </main>

    <!-- HEAD-TO-HEAD MODAL (Slide-up menu) -->
    <div id="team-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(17,24,39,0.5); backdrop-filter: blur(5px); z-index: 9000; align-items: flex-end; justify-content: center;">
        <div style="background: #fff; width: 100%; max-width: 500px; border-radius: 24px 24px 0 0; padding: 30px 20px; box-sizing: border-box; transform: translateY(100%); transition: transform 0.3s ease; max-height: 90vh; display: flex; flex-direction: column;" id="team-modal-content">
            
            <!-- Sticky Header van de Modal -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div id="modal-team-logo-container"></div>
                    <h2 id="modal-team-name" style="margin: 0; font-size: 20px; font-weight: 800; color: #1e293b;">Team Name</h2>
                </div>
                <button onclick="closeTeamModal()" style="background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; color: #64748b; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
            </div>
            
            <!-- Scrollbare Inhoud -->
            <div style="overflow-y: auto; flex-grow: 1; padding-bottom: 20px; -ms-overflow-style: none; scrollbar-width: none;">
                
                <!-- Quick Stats -->
                <div id="modal-quick-stats" style="display: flex; gap: 10px; margin-bottom: 20px;">
                    <!-- Wordt ingevuld door JS -->
                </div>

                <h3 style="font-size: 13px; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 15px 0;">Onderlinge Matchen</h3>
                
                <div id="team-history-list">
                    <!-- Lijst met matchen komt hier -->
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/database.js"></script>

    <script>
        let allePloegenHTML = [];
        let alleWedstrijdenGlobal = []; // Bewaar alle data lokaal

        async function laadPloegen() {
            const container = document.getElementById('ploegen-lijst');
            try {
                // Haal formele logo's op én ALLE wedstrijden tegelijk
                const [formeleRes, matchenRes] = await Promise.all([
                    supabaseClient.from('ploegen').select('naam, logo_url'),
                    supabaseClient.from('wedstrijden').select('*').order('datum', { ascending: false })
                ]);

                if (formeleRes.error) throw formeleRes.error;
                if (matchenRes.error) throw matchenRes.error;

                const formelePloegen = formeleRes.data;
                alleWedstrijdenGlobal = matchenRes.data;

                const uniekePloegen = new Map();

                if (formelePloegen) {
                    formelePloegen.forEach(p => {
                        uniekePloegen.set(p.naam.trim().toLowerCase(), { naam: p.naam.trim(), logo: p.logo_url });
                    });
                }

                if (alleWedstrijdenGlobal) {
                    alleWedstrijdenGlobal.forEach(m => {
                        if (m.tegenstander) {
                            const naam = m.tegenstander.trim().toLowerCase();
                            if (!uniekePloegen.has(naam)) {
                                uniekePloegen.set(naam, { naam: m.tegenstander.trim(), logo: m.logo_tegenstander });
                            } else if (!uniekePloegen.get(naam).logo && m.logo_tegenstander) {
                                uniekePloegen.get(naam).logo = m.logo_tegenstander;
                            }
                        }
                        
                        if (m.mini_scores) {
                            m.mini_scores.forEach(s => {
                                if (s.tegenstander) {
                                    const sNaam = s.tegenstander.trim().toLowerCase();
                                    if (!uniekePloegen.has(sNaam)) {
                                        uniekePloegen.set(sNaam, { naam: s.tegenstander.trim(), logo: s.logo_tegenstander });
                                    } else if (!uniekePloegen.get(sNaam).logo && s.logo_tegenstander) {
                                        uniekePloegen.get(sNaam).logo = s.logo_tegenstander;
                                    }
                                }
                            });
                        }
                    });
                }

                const ploegenLijstData = Array.from(uniekePloegen.values());
                ploegenLijstData.sort((a, b) => a.naam.localeCompare(b.naam));

                container.innerHTML = '';
                allePloegenHTML = []; 

                if (ploegenLijstData.length === 0) {
                    container.innerHTML = '<p class="empty-state" style="grid-column: 1 / -1;">Nog geen ploegen bekend.</p>';
                    return;
                }

                ploegenLijstData.forEach(p => {
                    const safeNaam = p.naam.replace(/'/g, "\\'");
                    const safeLogo = p.logo ? p.logo.replace(/'/g, "\\'") : '';
                    
                    const logoHtml = p.logo 
                        ? `<img src="${p.logo}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 50%; border: 1px solid #e5e7eb; margin-bottom: 8px;">` 
                        : `<div style="width: 50px; height: 50px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 1px solid #e5e7eb; margin-bottom: 8px;">🛡️</div>`;

                    const item = document.createElement('div');
                    item.className = 'ploeg-item';
                    item.dataset.naam = p.naam.toLowerCase(); 
                    item.style = "background: #fff; padding: 15px 10px; border-radius: 16px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.02); border: 1px solid #e5e7eb; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;";
                    
                    // ONCLICK EVENT TOEGEVOEGD: Opent de geschiedenis Modal
                    item.setAttribute('onclick', `openTeamModal('${safeNaam}', '${safeLogo}')`);

                    item.innerHTML = `
                        ${logoHtml}
                        <span style="font-size: 12px; font-weight: 700; color: #1e293b; line-height: 1.2;">${p.naam}</span>
                    `;
                    
                    container.appendChild(item);
                    allePloegenHTML.push(item);
                });

            } catch (err) {
                container.innerHTML = '<p class="empty-state" style="grid-column: 1 / -1;">Fout bij laden.</p>';
            }
        }

        function filterPloegen() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase().trim();
            const container = document.getElementById('ploegen-lijst');
            let zichtbaar = 0;

            allePloegenHTML.forEach(item => {
                const ploegNaam = item.dataset.naam;
                if (ploegNaam.includes(filter)) {
                    item.style.display = "flex";
                    zichtbaar++;
                } else {
                    item.style.display = "none";
                }
            });

            const bestaandeMelding = document.getElementById('no-results-msg');
            if (zichtbaar === 0) {
                if (!bestaandeMelding) {
                    const msg = document.createElement('p');
                    msg.id = 'no-results-msg';
                    msg.className = 'empty-state';
                    msg.style.gridColumn = '1 / -1';
                    msg.innerText = `Geen ploeg gevonden met "${input.value}"`;
                    container.appendChild(msg);
                } else {
                    bestaandeMelding.innerText = `Geen ploeg gevonden met "${input.value}"`;
                    bestaandeMelding.style.display = 'block';
                }
            } else if (bestaandeMelding) {
                bestaandeMelding.style.display = 'none';
            }
        }

        // --- H2H MODAL LOGICA ---

        window.openTeamModal = function(teamNaam, teamLogo) {
            document.getElementById('modal-team-name').innerText = teamNaam;
            
            const logoContainer = document.getElementById('modal-team-logo-container');
            if (teamLogo) {
                logoContainer.innerHTML = `<img src="${teamLogo}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid #e5e7eb;">`;
            } else {
                logoContainer.innerHTML = `<div style="width: 40px; height: 40px; background: #f1f5f9; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; border: 1px solid #e5e7eb;">🛡️</div>`;
            }

            // Zoek alle ontmoetingen in de geschiedenis
            let encounters = [];
            let statsWins = 0, statsDraws = 0, statsLosses = 0, statsGoals = 0;

            alleWedstrijdenGlobal.forEach(m => {
                if (m.mini_scores) {
                    m.mini_scores.forEach(s => {
                        let sTegenstander = (s.tegenstander || m.tegenstander || "").trim().toLowerCase();
                        if (sTegenstander === teamNaam.toLowerCase()) {
                            encounters.push({
                                datum: new Date(m.datum),
                                speler: m.speler,
                                categorie: m.categorie,
                                locatie: m.locatie,
                                thuis: s.thuis,
                                uit: s.uit,
                                goals: s.goals || 0,
                                matchId: m.id
                            });

                            let isWin = false;
                            if (s.thuis > s.uit) isWin = m.locatie === 'Thuis';
                            if (s.thuis < s.uit) isWin = m.locatie === 'Uit';
                            let isDraw = s.thuis === s.uit;
                            
                            if (isWin) statsWins++;
                            else if (isDraw) statsDraws++;
                            else statsLosses++;
                            
                            statsGoals += (s.goals || 0);
                        }
                    });
                }
            });

            // Bouw de Quick Stats HTML
            document.getElementById('modal-quick-stats').innerHTML = `
                <div style="flex: 1; text-align: center; background: #f8fafc; padding: 12px 5px; border-radius: 12px; border: 1px solid #f1f5f9;">
                    <span style="display: block; font-size: 18px; font-weight: 800; color: #1e293b;">${encounters.length}</span>
                    <span style="font-size: 9px; font-weight: 700; color: #64748b; text-transform: uppercase;">Gespeeld</span>
                </div>
                <div style="flex: 1; text-align: center; background: #ecfdf5; border: 1px solid #d1fae5; padding: 12px 5px; border-radius: 12px;">
                    <span style="display: block; font-size: 18px; font-weight: 800; color: #059669;">${statsWins}</span>
                    <span style="font-size: 9px; font-weight: 700; color: #059669; text-transform: uppercase;">Winst</span>
                </div>
                <div style="flex: 1; text-align: center; background: #fffbeb; border: 1px solid #fef3c7; padding: 12px 5px; border-radius: 12px;">
                    <span style="display: block; font-size: 18px; font-weight: 800; color: #d97706;">${statsGoals}</span>
                    <span style="font-size: 9px; font-weight: 700; color: #d97706; text-transform: uppercase;">Goals</span>
                </div>
            `;

            // Sorteer op datum (nieuwste bovenaan)
            encounters.sort((a,b) => b.datum - a.datum);

            const listContainer = document.getElementById('team-history-list');
            let listHtml = '';

            if (encounters.length === 0) {
                listHtml = '<p class="empty-state">Geen gedetailleerde uitslagen gevonden.</p>';
            } else {
                encounters.forEach(enc => {
                    const datumMooi = enc.datum.toLocaleDateString('nl-BE', {day: 'numeric', month: 'short', year: 'numeric'}).toUpperCase();
                    
                    let statusClass = 'draw';
                    if (enc.thuis > enc.uit) statusClass = enc.locatie === 'Thuis' ? 'win' : 'loss';
                    if (enc.thuis < enc.uit) statusClass = enc.locatie === 'Thuis' ? 'loss' : 'win';
                    
                    let bgStatus = statusClass === 'win' ? '#ecfdf5' : (statusClass === 'loss' ? '#fef2f2' : '#f1f5f9');
                    let colorStatus = statusClass === 'win' ? '#059669' : (statusClass === 'loss' ? '#dc2626' : '#4b5563');

                    let spelerColor = enc.speler === 'Lou' ? '#F34213' : '#ef476f';
                    let spelerBg = enc.speler === 'Lou' ? '#ffedd5' : '#fce7f3'; 

                    listHtml += `
                        <a href="match-detail.html?id=${enc.matchId}" style="text-decoration: none; display: block; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); transition: transform 0.1s;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                <span style="font-size: 11px; font-weight: 800; color: #94a3b8; letter-spacing: 0.5px;">${datumMooi}</span>
                                <div style="display: flex; gap: 6px;">
                                    <span style="padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; background: #f1f5f9; color: #4b5563; border: 1px solid #e2e8f0;">${enc.categorie || 'U?'}</span>
                                    <span style="padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; background: ${spelerBg}; color: ${spelerColor}; border: 1px solid ${spelerColor}33;">${enc.speler}</span>
                                </div>
                            </div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div style="font-weight: 800; font-size: 16px; padding: 6px 12px; border-radius: 8px; background: ${bgStatus}; color: ${colorStatus}; border: 1px solid ${colorStatus}33;">
                                    ${enc.thuis} - ${enc.uit}
                                </div>
                                ${enc.goals > 0 
                                    ? `<div style="font-size: 14px; font-weight: 800; color: #1e293b;">⚽ ${enc.goals} Goal${enc.goals>1?'s':''}</div>` 
                                    : `<div style="font-size: 12px; font-weight: 600; color: #94a3b8;">Geen goals</div>`}
                            </div>
                        </a>
                    `;
                });
            }

            listContainer.innerHTML = listHtml;

            // Toon modal met animatie
            const modal = document.getElementById('team-modal');
            modal.style.display = 'flex';
            setTimeout(() => {
                document.getElementById('team-modal-content').style.transform = 'translateY(0)';
            }, 10);
        };

        window.closeTeamModal = function() {
            document.getElementById('team-modal-content').style.transform = 'translateY(100%)';
            setTimeout(() => {
                document.getElementById('team-modal').style.display = 'none';
            }, 300);
        };

        document.addEventListener('DOMContentLoaded', laadPloegen);
    </script>
</body>
</html>
