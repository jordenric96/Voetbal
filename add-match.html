<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Match Toevoegen</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f8fafc">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        /* PIN toetsenbord styling */
        .pin-dots-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0 30px 0; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #cbd5e1; transition: all 0.2s ease; }
        .pin-dot.filled { background: #1e293b; border-color: #1e293b; }
        .pin-dot.error { border-color: #dc2626; background: #fef2f2; }
        
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .numpad-btn { background: #f8fafc; border: 1px solid #f1f5f9; font-size: 26px; font-weight: 600; color: #1e293b; border-radius: 50%; width: 70px; height: 70px; margin: 0 auto; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-tap-highlight-color: transparent; }
        .numpad-btn:active { background: #e2e8f0; transform: scale(0.95); }
        .numpad-btn.empty { background: transparent; border: none; cursor: default; }
        .numpad-btn.empty:active { transform: none; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid #e5e7eb;">
        <h1 style="margin: 0; font-size: 24px; color: #1e293b;">Match Toevoegen</h1>
        <a href="index.html" style="color: #94a3b8; font-weight: 700; text-decoration: none; font-size: 15px;">Annuleer</a>
    </header>

    <!-- BEVEILIGING SCHERM -->
    <div id="pin-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; padding: 20px;">
        <div style="background: #fff; width: 100%; max-width: 360px; border-radius: 28px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.05); border: 1px solid #f1f5f9;">
            <h3 style="margin: 0; font-size: 20px; font-weight: 800; color: #1e293b;">Toegang Beveiligd</h3>
            <p style="margin: 6px 0 0 0; font-size: 13px; color: #64748b; font-weight: 600;">Voer je pincode in om verder te gaan.</p>
            
            <div id="pin-dots" class="pin-dots-container">
                <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
            </div>

            <div class="numpad-grid">
                <div class="numpad-btn" onclick="addPinDigit('1')">1</div>
                <div class="numpad-btn" onclick="addPinDigit('2')">2</div>
                <div class="numpad-btn" onclick="addPinDigit('3')">3</div>
                <div class="numpad-btn" onclick="addPinDigit('4')">4</div>
                <div class="numpad-btn" onclick="addPinDigit('5')">5</div>
                <div class="numpad-btn" onclick="addPinDigit('6')">6</div>
                <div class="numpad-btn" onclick="addPinDigit('7')">7</div>
                <div class="numpad-btn" onclick="addPinDigit('8')">8</div>
                <div class="numpad-btn" onclick="addPinDigit('9')">9</div>
                <div class="numpad-btn empty"></div>
                <div class="numpad-btn" onclick="addPinDigit('0')">0</div>
                <div class="numpad-btn" style="font-size: 20px; background: #f1f5f9;" onclick="removePinDigit()">⌫</div>
            </div>
        </div>
    </div>

    <!-- FORMULIER SCHERM (Verborgen tot pincode klopt, of automatisch getoond bij bewerken) -->
    <main id="form-screen" style="display: none; padding: 20px 20px 100px 20px;">
        <div id="matchForm">
            
            <div style="background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #e5e7eb;">
                <h2 style="font-size: 13px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">Basis Info</h2>
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label>Speler</label>
                        <select id="speler" required>
                            <option value="Lou">Lou</option>
                            <option value="Noé">Noé</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label>Datum</label>
                        <input type="date" id="datum" required>
                    </div>
                </div>
                
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label>Locatie</label>
                        <select id="locatie">
                            <option value="Thuis">Thuis</option>
                            <option value="Uit">Uit / Verplaatsing</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label>Type</label>
                        <select id="type_wedstrijd" onchange="toggleWedstrijdType()">
                            <option value="Competitie">Competitie</option>
                            <option value="Toernooi">Toernooi</option>
                            <option value="Vriendschappelijk">Vriendschappelijk</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 15px;">
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label>Categorie</label>
                        <select id="categorie">
                            <option value="U6">U6</option>
                            <option value="U7">U7</option>
                            <option value="U8">U8</option>
                            <option value="U9">U9</option>
                            <option value="U10">U10</option>
                            <option value="U11">U11</option>
                            <option value="U12">U12</option>
                            <option value="U13">U13</option>
                            <option value="U14">U14</option>
                            <option value="U15">U15</option>
                            <option value="U16">U16</option>
                            <option value="U17">U17</option>
                            <option value="Beloften">Beloften</option>
                            <option value="Eerste Ploeg">Eerste Ploeg</option>
                            <option value="Veteranen">Veteranen</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label>Format</label>
                        <select id="match_format">
                            <option value="2v2">2v2</option>
                            <option value="3v3">3v3</option>
                            <option value="5v5">5v5</option>
                            <option value="8v8">8v8</option>
                            <option value="11v11">11v11</option>
                        </select>
                    </div>
                </div>
            </div>

            <div style="background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #e5e7eb;">
                <h2 style="font-size: 13px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">Ploegen</h2>
                <div class="form-group">
                    <label>Eigen Ploeg</label>
                    <input type="text" id="eigen_ploeg" value="KV Kester Gooik" required>
                </div>
                <div class="form-group" style="position: relative;">
                    <label id="label-tegenstander">Tegenstander</label>
                    <input type="text" id="tegenstander" placeholder="Typ om te zoeken..." autocomplete="off" required>
                </div>
                
                <div class="form-group" id="global-logo-tegenstander-container" style="display: none; background: #fffbeb; padding: 15px; border-radius: 12px; border: 1px solid #fef3c7; margin-top: 15px;">
                    <label style="color: #d97706; margin-bottom: 8px;">Nieuwe ploeg! Upload Logo (Optioneel)</label>
                    <input type="file" id="logo_tegenstander" accept="image/png, image/jpeg" style="background: #fff;">
                </div>
            </div>

            <div id="mini-scores-wrapper">
                <!-- Javascript will inject score rows here -->
            </div>
            
            <button type="button" onclick="addScoreRow()" style="width: 100%; padding: 16px; background: transparent; border: 2px dashed #cbd5e1; color: #64748b; border-radius: 16px; font-size: 14px; font-weight: 800; cursor: pointer; margin-bottom: 20px; transition: all 0.2s; text-transform: uppercase; letter-spacing: 0.5px;">+ Extra Match/Uitslag Toevoegen</button>

            <div style="background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #e5e7eb;">
                <h2 style="font-size: 13px; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 0 0 15px 0; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px;">Media & Notities</h2>
                <div class="form-group" style="margin-bottom: 15px;">
                    <label>Notitie / Opmerking</label>
                    <textarea id="opmerking" rows="3" placeholder="Bijzonderheden over de match..."></textarea>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label>Foto's & Video's Toevoegen</label>
                    <input type="file" id="fotos" accept="image/*, video/*" multiple>
                    <span style="font-size: 10px; color: #94a3b8; display: block; margin-top: 6px;">Hogere kwaliteit (tot 2MB per foto). Video's max 50MB.</span>
                </div>
            </div>

            <button type="button" class="submit-btn" onclick="saveMatch()" style="background: #1e293b; color: #fff; width: 100%; padding: 18px; border-radius: 16px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(30, 41, 59, 0.2);">Match Opslaan</button>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
    <script src="js/database.js"></script>
    <script src="js/upload.js"></script>
</body>
</html>
