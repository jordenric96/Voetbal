    <style>
        /* Specifieke CSS voor het custom PIN toetsenbord */
        .pin-dots-container { display: flex; justify-content: center; gap: 15px; margin: 20px 0 30px 0; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #cbd5e1; transition: all 0.2s ease; }
        .pin-dot.filled { background: #1e293b; border-color: #1e293b; }
        .pin-dot.error { border-color: #dc2626; background: #fef2f2; }
        
        .numpad-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
        .numpad-btn { background: #f8fafc; border: 1px solid #f1f5f9; font-size: 26px; font-weight: 600; color: #1e293b; border-radius: 50%; width: 70px; height: 70px; margin: 0 auto; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-tap-highlight-color: transparent; }
        .numpad-btn:active { background: #e2e8f0; transform: scale(0.95); }
        .numpad-btn.empty { background: transparent; border: none; cursor: default; }
        .numpad-btn.empty:active { transform: none; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-8px); } }
        .shake { animation: shake 0.4s ease-in-out; }
    </style>

    <div id="pin-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; padding: 20px;">
        <div style="background: #fff; width: 100%; max-width: 360px; border-radius: 28px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.05);">
            <h3 style="margin: 0; font-size: 20px; font-weight: 800; color: #1e293b;">Toegang Beveiligd</h3>
            <p style="margin: 6px 0 0 0; font-size: 13px; color: #64748b; font-weight: 600;">Voer je pincode in om verder te gaan.</p>
            
            <div id="pin-dots" class="pin-dots-container">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>

            <div class="numpad-grid">
                <div class="numpad-btn" onclick="addPinDigit('1')">1</div>
                <div class="numpad-btn" onclick="addPinDigit('2')">2</div>
                <div class="numpad-btn" onclick="addPinDigit('3')">3</div>
                <div class="numpad-btn" onclick="addPinDigit('4')">4</div>
                <div class="numpad-btn" onclick="addPinDigit('5')">5</div>
                <div class="numpad-btn" onclick="addPinDigit('6')">6</div>
                <div class="numpad-btn" onclick="addPinDigit('7')">7</div>
                <div class="numpad-btn" onclick="addPinDigit('8')">8</div>
                <div class="numpad-btn" onclick="addPinDigit('9')">9</div>
                <div class="numpad-btn empty"></div>
                <div class="numpad-btn" onclick="addPinDigit('0')">0</div>
                <div class="numpad-btn" style="font-size: 20px; background: #f1f5f9;" onclick="removePinDigit()">⌫</div>
            </div>

            <a href="index.html" style="color: #94a3b8; text-decoration: none; font-size: 14px; font-weight: 700; display: inline-block; margin-top: 10px;">Annuleren</a>
        </div>
    </div>
